<!DOCTYPE html>
<html lang="{{ site.locale | default: 'ko' }}" data-theme="dark">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">본문 바로가기</a>
    {% include page-header.html %}

    <main id="main" class="page page--prose">
      <article class="container container--prose">
        {% if page.title and page.permalink != '/' %}
          <p class="page__back"><a href="{{ '/' | relative_url }}">← 한국 리눅스 커널 개발자 모임</a></p>
        {% endif %}
        {{ content }}
      </article>
    </main>

    {% include page-footer.html %}
  </body>
</html>
